{% extends "base.html" %}
{% block title %}Signed out · VoteSys{% endblock %}
{% block content %}
<style>
  /* ---- Signed out ---- */
  .bye-card { text-align: center; }
  .bye-icon {
    width: 68px;
    height: 68px;
    margin: 0 auto;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    background: linear-gradient(160deg, var(--primary-hover) 0%, var(--primary-dark) 100%);
    color: #fff;
    box-shadow: 0 14px 30px -10px rgb(79 70 229 / 55%);
    animation: bye-pop 0.5s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  @keyframes bye-pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .bye-card h1 { font-size: 1.4rem; font-weight: 750; letter-spacing: -0.02em; margin: 0; }
  .bye-card p { color: var(--text-secondary); margin: 0; }
</style>

<div class="login-page">
  <div class="login-card bye-card">
    <div class="bye-icon"><i class="bi bi-box-arrow-right"></i></div>
    <h1>Signed out</h1>
    <p>You have been signed out safely. Thank you for serving the election process.</p>
    <a class="btn btn-primary btn-block" href="{% url 'home' %}"><i class="bi bi-arrow-left"></i> Back to elections</a>
  </div>
</div>
{% endblock %}
