{% extends "elections/base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="login-card card">
  <h3 style="margin-bottom:4px;">Admin Login</h3>
  <p style="color:var(--gray-500);font-size:.875rem;margin-bottom:20px;">
    Authorized election administrators only.
  </p>
  <form method="post" action="{% url 'elections:admin_login' %}">
    {% csrf_token %}
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" name="username" id="username" placeholder="Admin username" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" name="password" id="password" placeholder="Admin password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Sign In</button>
  </form>
</div>
{% endblock %}
