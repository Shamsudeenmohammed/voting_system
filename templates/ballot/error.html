{% extends "ballot/base.html" %}
{% block title %}{{ title }} · VoteSys{% endblock %}
{% block content %}
<style>
  /* ---- Ballot error ---- */
  .error-card { text-align: center; }
  .error-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.9rem;
    background: linear-gradient(160deg, #ef4444 0%, #b91c1c 100%);
    color: #fff;
    box-shadow: 0 16px 34px -10px rgb(220 38 38 / 55%);
    animation: err-shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
  }
  @keyframes err-shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  .error-card h1 { font-size: 1.4rem; font-weight: 750; letter-spacing: -0.025em; margin: 0; color: var(--text-primary); }
  .error-card p { color: var(--text-secondary); line-height: 1.7; margin: 0; }
</style>

<div class="login-card error-card">
  <div class="error-icon"><i class="bi bi-exclamation-triangle"></i></div>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <a class="btn btn-outline btn-block" href="{% url 'home' %}">
    <i class="bi bi-arrow-left"></i> Back to elections
  </a>
</div>
{% endblock %}
